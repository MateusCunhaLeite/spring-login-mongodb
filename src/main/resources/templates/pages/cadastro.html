<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta</title>
</head>
<body>
<main class="container">
    <section class="card">
        <h1>Criar conta</h1>

        <!-- novalidate: as regras são validadas no servidor, com mensagens em português -->
        <form th:action="@{/cadastro}" th:object="${form}" method="post" class="form" novalidate>
            <div class="field">
                <label for="nome">Nome completo</label>
                <input type="text" th:field="*{nome}" th:errorclass="is-invalid"
                       autocomplete="name" aria-describedby="nome-erro" required>
                <p class="field-error" id="nome-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" th:field="*{email}" th:errorclass="is-invalid"
                       autocomplete="email" aria-describedby="email-dica email-erro" required>
                <p class="hint" id="email-dica" th:if="${dominioPermitido}">
                    Use seu e-mail <strong th:text="'@' + ${dominioPermitido}">@exemplo.com</strong>.
                </p>
                <p class="field-error" id="email-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <!-- As senhas não usam th:field de propósito: nunca são devolvidas preenchidas para a tela -->
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"
                       autocomplete="new-password" aria-describedby="senha-dica senha-erro" required>
                <p class="hint" id="senha-dica">Mínimo de 8 caracteres, com letras e números.</p>
                <p class="field-error" id="senha-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>
            </div>

            <div class="field">
                <label for="confirmacaoSenha">Confirme a senha</label>
                <input type="password" id="confirmacaoSenha" name="confirmacaoSenha"
                       th:classappend="${#fields.hasErrors('confirmacaoSenha')} ? 'is-invalid'"
                       autocomplete="new-password" aria-describedby="confirmacao-erro" required>
                <p class="field-error" id="confirmacao-erro" th:if="${#fields.hasErrors('confirmacaoSenha')}"
                   th:errors="*{confirmacaoSenha}"></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
        </form>

        <p>Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </section>
</main>
</body>
</html>
